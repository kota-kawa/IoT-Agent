version: "3.9"
services:
  web:
    container_name: iot-agent
    build: .
    ports:
      - "5006:5006"
    env_file:
      - secrets.env
    volumes:
      - ./:/app
    command: ["uvicorn", "app:app", "--host=0.0.0.0", "--port=5006", "--reload"]
    restart: unless-stopped
    networks:
      - default
      - multi_agent_network

networks:
  multi_agent_network:
    external: true
    name: ${MULTI_AGENT_NETWORK:-multi_agent_platform_net}
