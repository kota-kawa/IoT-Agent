<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IoT Agent Result</title>
  <link rel="icon" type="image/png" href="static/icons/iot-agent-favicon.png" sizes="512x512" />
  <link rel="icon" type="image/x-icon" href="static/icons/iot-agent-favicon.ico" />
  <link rel="stylesheet" href="static/styles.css" />
  <style>
    /* Specific overrides for the result page to remove layout constraints of the main app */
    body {
      background: var(--bg); /* Ensure background is set */
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden; /* Main scroll handled by main element if needed */
    }
    .app-standalone {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .main {
      /* Reset some properties from the original .main class if necessary */
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      border: none;
      box-shadow: none;
      background: transparent;
      padding: 0;
    }
    .main__header {
        border-bottom: 1px solid rgba(255,255,255,.06);
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
    .grid-wrapper {
        flex: 1;
        overflow-y: auto;
    }
    .grid {
        padding-bottom: 40px; /* Space for scrolling */
    }
  </style>
</head>
<body>
  <div class="app-standalone">
    <main class="main">
      <header class="main__header">
        <div>
          <h2 class="main__title">IoT デバイス状態</h2>
          <p class="main__subtitle">登録されたデバイスの現在の状態と実行結果を表示しています。</p>
        </div>
        <div class="main__notice" id="registerNotice" role="status" aria-live="polite" hidden></div>
      </header>

      <!-- Device Grid -->
      <div class="grid-wrapper">
        <section class="grid" id="deviceGrid" aria-label="デバイス一覧">
          <!-- Cards rendered by JS -->
        </section>
      </div>
    </main>
  </div>

  <script src="static/agent_result.js"></script>
</body>
</html>
